[package]
name = "eprice"
version = "0.1.0"
authors = ["qqke <qwxd0827@gmail.com>"]
edition = "2024"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
rust-version = "1.92"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
egui = "0.34.1"
eframe = { version = "0.34.1", default-features = false, features = [
    "accesskit",     # Make egui compatible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
    "wayland",       # To support Linux (and CI)
] }
log = "0.4.29"

# You only need serde if you want app persistence:
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
walkers = "0.53.0"
walkers_extras = "0.53.0"
geo = { version = "0.32.0", features = ["use-serde"] }
chrono = { version = "0.4.44", features = ["serde"] }
egui_extras = "0.34.1"

# Database and authentication (native-only; wasm 构建不需要)
bcrypt = "0.19.0"
uuid = { version = "1.22.0", features = ["v4", "serde", "js"] }

# OCR and image processing (disabled due to system dependencies)
# leptess = "0.14"
# image = { version = "0.25", features = ["jpeg", "png"] }

# Error handling and utilities
anyhow = "1.0.102"
thiserror = "2.0.18"
once_cell = "1.21.4"
regex = "1.12.3"

# Async support
futures = "0.3.32"

# Testing dependencies
[dev-dependencies]
tokio-test = "0.4.5"
mockall = "0.14.0"
tempfile = "3.27.0"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.9"
# Additional native dependencies for file operations, camera access
rfd = "0.17.2"  # For file dialogs
nokhwa = { version = "0.10.10", features = ["input-msmf"] }  # For camera access (barcode scanning)
sqlx = { version = "0.9.0-alpha.1", default-features = false }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.66"
web-sys = "0.3.91"           # to access the DOM (to hide the loading text)
# 为不同主版本的 getrandom 启用 wasm 支持（有些间接依赖仍在用 0.2）
getrandom = { version = "0.4.2", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2.17", features = ["js"] }

[profile.release]
opt-level = 2 # fast and small wasm

# Optimize all dependencies even in debug builds:
[profile.dev.package."*"]
opt-level = 2


[patch.crates-io]

# If you want to use the bleeding edge version of egui and eframe:
# egui = { git = "https://github.com/emilk/egui", branch = "master" }
# eframe = { git = "https://github.com/emilk/egui", branch = "master" }

# If you fork https://github.com/emilk/egui you can test with:
# egui = { path = "../egui/crates/egui" }
# eframe = { path = "../egui/crates/eframe" }

